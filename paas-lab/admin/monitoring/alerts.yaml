# Alertas automáticas por tenant (se evalúan en Prometheus, se enrutan en Alertmanager).
#   kubectl apply -f admin/monitoring/alerts.yaml
# Va en el namespace 'monitoring' con label release=prometheus: es el selector por defecto
# de kube-prometheus-stack instalado con 'helm install prometheus ...'.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: paas-tenant-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
  - name: paas.tenant.quota
    rules:
    - alert: TenantQuotaNearLimit
      expr: |
        (
          kube_resourcequota{namespace=~"tenant-.+", type="used"}
            / ignoring(type)
          kube_resourcequota{namespace=~"tenant-.+", type="hard"} >= 0.8
        ) < 1
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "{{ $labels.namespace }}: cuota {{ $labels.resource }} al {{ $value | humanizePercentage }}"
        description: "El tenant superó el 80% de la cuota {{ $labels.resource }}. Reducir consumo o contratar un plan mayor."
    - alert: TenantQuotaExhausted
      expr: |
        kube_resourcequota{namespace=~"tenant-.+", type="used"}
          / ignoring(type)
        kube_resourcequota{namespace=~"tenant-.+", type="hard"} >= 1
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "{{ $labels.namespace }}: cuota {{ $labels.resource }} agotada"
        description: "Se rechazará la creación de nuevos pods/PVC que requieran {{ $labels.resource }}."
    - alert: TenantHpaAtMaxReplicas
      expr: |
        kube_horizontalpodautoscaler_status_current_replicas{namespace=~"tenant-.+"}
          >= kube_horizontalpodautoscaler_spec_max_replicas{namespace=~"tenant-.+"}
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "{{ $labels.namespace }}: HPA {{ $labels.horizontalpodautoscaler }} en su máximo de réplicas"
        description: "La aplicación necesita más capacidad que la permitida por su plan."
