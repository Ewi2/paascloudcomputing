# Enrutamiento de alertas: cada alerta va al receptor del cliente dueño del namespace.
# Lo aplica scripts/bootstrap.sh monitoring junto con kube-prometheus-stack-values.yaml.
# Alta de un tenant: agregar aquí su ruta y su receptor.
# Los receptores apuntan al alert-sink del laboratorio. En producción se reemplaza
# webhook_configs por email_configs o slack_configs con el contacto real de cada cliente.
alertmanager:
  config:
    route:
      receiver: "null"
      group_by: [namespace, alertname]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 30m
      routes:
      - matchers: ['namespace="tenant-alpha"']
        receiver: cliente-alpha
      - matchers: ['namespace="tenant-beta"']
        receiver: cliente-beta
    receivers:
    - name: "null"
    - name: cliente-alpha
      webhook_configs:
      - url: http://alert-sink.monitoring.svc.cluster.local:8080/alpha
        send_resolved: true
    - name: cliente-beta
      webhook_configs:
      - url: http://alert-sink.monitoring.svc.cluster.local:8080/beta
        send_resolved: true
