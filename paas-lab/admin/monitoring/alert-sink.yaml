# Receptor de alertas del laboratorio: imprime cada alerta recibida (kubectl logs -n monitoring deploy/alert-sink).
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-sink-script
  namespace: monitoring
data:
  sink.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            body = self.rfile.read(int(self.headers.get("Content-Length", 0)))
            for a in json.loads(body).get("alerts", []):
                l = a.get("labels", {})
                print(f'[{self.path}] {a.get("status")} {l.get("alertname")} '
                      f'ns={l.get("namespace")} resource={l.get("resource", "-")} '
                      f':: {a.get("annotations", {}).get("summary", "")}', flush=True)
            self.send_response(200)
            self.end_headers()

        def log_message(self, *args):
            pass

    HTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-sink
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: {app: alert-sink}
  template:
    metadata:
      labels: {app: alert-sink}
    spec:
      containers:
      - name: sink
        image: python:3.12-alpine
        command: ["python", "-u", "/app/sink.py"]
        ports:
        - containerPort: 8080
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 100m, memory: 64Mi}
        volumeMounts:
        - {name: script, mountPath: /app}
      volumes:
      - name: script
        configMap:
          name: alert-sink-script
---
apiVersion: v1
kind: Service
metadata:
  name: alert-sink
  namespace: monitoring
spec:
  selector:
    app: alert-sink
  ports:
  - port: 8080
    targetPort: 8080
