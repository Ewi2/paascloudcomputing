# Receptor de alertas del laboratorio (código en alert-sink.py).
#   kubectl logs -n monitoring deploy/alert-sink
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-sink
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alert-sink
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-sink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-sink
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: sink
        image: python:3.12-alpine
        command: ["python", "-u", "/app/alert-sink.py"]
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 100m, memory: 64Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: script
          mountPath: /app
          readOnly: true
      volumes:
      - name: script
        configMap:
          name: alert-sink-script
---
apiVersion: v1
kind: Service
metadata:
  name: alert-sink
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alert-sink
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alert-sink
  ports:
  - name: http
    port: 8080
    targetPort: http
