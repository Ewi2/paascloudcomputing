# Valores por contenedor cuando no se declaran requests/limits, y rango permitido.
# El mínimo (10m, 16Mi) admite los workers de la Fase 5 y los pods de tests/.
apiVersion: v1
kind: LimitRange
metadata:
  name: paas-defaults
spec:
  limits:
  - type: Container
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 200m
      memory: 256Mi
    min:
      cpu: 10m
      memory: 16Mi
    max:
      cpu: "1"
      memory: 1Gi
  - type: PersistentVolumeClaim
    min:
      storage: 100Mi
    max:
      storage: 5Gi
