# Consumidor de la cola del tenant. KEDA lo lleva de 0 a N réplicas según la longitud de la
# cola y de vuelta a 0 cuando se vacía. La lógica está en worker.sh (ConfigMap worker-script).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
spec:
  replicas: 0                      # estado inicial; después lo controla KEDA
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: curlimages/curl:8.12.1
        command: ["/bin/sh", "/opt/worker/worker.sh"]
        env:
        - name: RABBITMQ_API
          value: http://rabbitmq:15672   # Service del mismo namespace
        - name: QUEUE_NAME
          value: pedidos           # mismo valor que queueName de scaler.yaml; debe figurar en QUEUES de rabbitmq.yaml
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef: {name: rabbitmq-credentials, key: RABBITMQ_DEFAULT_USER}
        - name: RABBITMQ_PASS
          valueFrom:
            secretKeyRef: {name: rabbitmq-credentials, key: RABBITMQ_DEFAULT_PASS}
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 40m, memory: 32Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: script
          mountPath: /opt/worker
          readOnly: true
      volumes:
      - name: script
        configMap:
          name: worker-script
