# Fase 5 - Recursos de escalado por eventos comunes a todo tenant: broker RabbitMQ propio,
# credenciales para KEDA, consumidor estándar (consumer/) y excepción de red para KEDA.
# No se aplica sola. La incluye cada overlay de tenants/<tenant>/, que fija el namespace y el SLA.
# Requiere KEDA instalado (CRD keda.sh) y el Secret rabbitmq-credentials en el namespace;
# scripts/bootstrap.sh events crea ambos. El Secret nunca se versiona.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- rabbitmq.yaml
- auth.yaml
- networkpolicy.yaml
- ../consumer
labels:
- pairs:
    app.kubernetes.io/part-of: paas-events
