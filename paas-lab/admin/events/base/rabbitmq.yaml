# Broker de mensajería del tenant: una instancia por namespace, sin persistencia (laboratorio).
# Puertos: 5672 (AMQP, lo consulta KEDA) y 15672 (API HTTP de administración, la usa el worker).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate                 # nunca dos brokers a la vez
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: rabbitmq
        image: rabbitmq:3.13-management-alpine   # incluye rabbitmqadmin
        ports:
        - name: amqp
          containerPort: 5672
        - name: http
          containerPort: 15672
        env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef: {name: rabbitmq-credentials, key: RABBITMQ_DEFAULT_USER}
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef: {name: rabbitmq-credentials, key: RABBITMQ_DEFAULT_PASS}
        - name: QUEUES
          # Colas que el broker declara al arrancar, separadas por espacios. Formato:
          # <nombre> o <nombre>:<prioridad máxima> (cola con prioridades, x-max-priority).
          value: pedidos
        lifecycle:
          postStart:
            exec:
              # Declara las colas en cuanto la API de administración responde (operación
              # idempotente). Así existen siempre que el broker está en servicio y KEDA puede
              # consultarlas aunque todavía no haya productores ni consumidores.
              command:
              - sh
              - -c
              - |
                admin() {
                  rabbitmqadmin --username="$RABBITMQ_DEFAULT_USER" --password="$RABBITMQ_DEFAULT_PASS" "$@"
                }
                for _ in $(seq 60); do
                  admin list queues >/dev/null 2>&1 && break
                  sleep 3
                done
                status=0
                for entry in $QUEUES; do
                  name="${entry%%:*}"
                  case "$entry" in
                    *:*) set -- arguments="{\"x-max-priority\":${entry#*:}}" ;;
                    *)   set -- ;;
                  esac
                  admin declare queue name="$name" durable=true "$@" >/dev/null \
                    || { echo "no se pudo declarar la cola $name" >&2; status=1; }
                done
                exit "$status"
        resources:
          requests: {cpu: 50m, memory: 160Mi}
          limits: {cpu: 500m, memory: 512Mi}
        readinessProbe:            # TCP: las sondas con rabbitmq-diagnostics inician una VM de Erlang por ejecución
          tcpSocket:
            port: amqp
          initialDelaySeconds: 10
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: data
          mountPath: /var/lib/rabbitmq
      volumes:
      - name: data
        emptyDir:
          sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: amqp
  - name: http
    port: 15672
    targetPort: http
