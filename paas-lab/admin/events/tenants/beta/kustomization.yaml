# Fase 5 para tenant-beta. SLA de eventos (alta capacidad): hasta 15 workers, 1 réplica cada 2 mensajes.
#   kubectl apply -k admin/events/tenants/beta
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tenant-beta
resources:
- ../../base
labels:
- pairs:
    paas/tenant: beta
patches:
- target:
    kind: ScaledObject
    name: worker
  patch: |-
    - op: replace
      path: /spec/maxReplicaCount
      value: 15
    - op: replace
      path: /spec/triggers/0/metadata/value
      value: "2"
