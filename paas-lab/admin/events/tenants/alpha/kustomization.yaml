# Fase 5 para tenant-alpha. SLA de eventos (estándar): hasta 5 workers, 1 réplica cada 5 mensajes.
#   kubectl apply -k admin/events/tenants/alpha
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tenant-alpha
resources:
- ../../base
labels:
- pairs:
    paas/tenant: alpha
patches:
- target:
    kind: ScaledObject
    name: worker
  patch: |-
    - op: replace
      path: /spec/maxReplicaCount
      value: 5
    - op: replace
      path: /spec/triggers/0/metadata/value
      value: "5"
