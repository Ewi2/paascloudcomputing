# Modo prioridad de la Fase 5 (guía "Cargas de prioridad alta vs. baja con KEDA").
# Agrega al tenant una cola prioritaria (pedidos-vip) con su propio consumidor (worker-vip) y
# vuelve más tolerante a la espera la cola estándar. Se aplica con un overlay que incluye el
# overlay normal del tenant y este Component (ver tenants/beta-priority/).
#
# KEDA no admite dos ScaledObject sobre el mismo Deployment: cada cola tiene su consumidor.
#
# Retirar el modo prioridad (el broker se reinicia y la cola pedidos-vip desaparece):
#   kubectl -n tenant-<t> delete scaledobject,deployment,configmap --selector paas/priority=vip
#   kubectl apply -k admin/events/tenants/<t>
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
- vip
patches:
# El broker declara también la cola prioritaria, con prioridades de 0 a 10.
- target:
    kind: Deployment
    name: rabbitmq
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/2/value
      value: pedidos pedidos-vip:10   # QUEUES
# Cola estándar: acumula más mensajes por réplica y se consulta con menos frecuencia.
- target:
    kind: ScaledObject
    # Por etiqueta y no por nombre: Kustomize también compara el nombre original de cada
    # recurso, y el de worker-vip es "worker".
    labelSelector: "!paas/priority"
  patch: |-
    - op: replace
      path: /spec/triggers/0/metadata/value
      value: "15"
    - op: replace
      path: /spec/pollingInterval
      value: 15
