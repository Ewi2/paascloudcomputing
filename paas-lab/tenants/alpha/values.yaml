# Único archivo editable por el cliente alpha (plan standard: hasta 3 réplicas).
appName: mi-web-service          # nombre de la aplicación (y de su Service)
image: "nginx:alpine"            # imagen con tag explícito o digest
port: 80                         # puerto en el que escucha el contenedor
replicaCount: 1                  # réplicas iniciales (y mínimo del autoescalado)
domain: alpha.paas.local         # dominio asignado o un subdominio suyo

# Variables de entorno. Nombres: letras, dígitos y _. Valores: SIEMPRE entre comillas.
env:                             # no sensibles (se guardan en un ConfigMap)
  APP_ENV: "production"
# secretEnv:                     # sensibles: claves, tokens (se guardan en un Secret)
#   DB_PASSWORD: "cambiar-esto"

autoscaling:
  enabled: true
  maxReplicas: 3                 # no puede superar el máximo del plan
  targetCPU: 70                  # % de CPU que dispara el escalado (10-95)
