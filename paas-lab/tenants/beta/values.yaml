# Único archivo editable por el cliente beta (plan basic: hasta 2 réplicas).
# Aplicación Python/Flask con volumen: otra tecnología que la de alpha.
appName: api-httpbin
image: "kennethreitz/httpbin:latest"
port: 80
replicaCount: 1
domain: beta.paas.local

# Variables de entorno. Nombres: letras, dígitos y _. Valores: SIEMPRE entre comillas.
env:                             # no sensibles (se guardan en un ConfigMap)
  GUNICORN_CMD_ARGS: "--capture-output --error-logfile - --workers 2"
# secretEnv:                     # sensibles: claves, tokens (se guardan en un Secret)
#   API_KEY: "cambiar-esto"

persistence:                     # volumen del cliente (consume la cuota de storage del tenant)
  enabled: true
  size: 1Gi
  mountPath: /data

autoscaling:
  enabled: true
  maxReplicas: 2
  targetCPU: 70
