# Planes del proveedor. Regla de coherencia con la ResourceQuota del tenant:
#   maxReplicas * requests.cpu + maxSurge (25 %, redondeado arriba) * requests.cpu <= quota requests.cpu

# scaling.ingressRpsPerPod: peticiones/s por pod que fijan el objetivo del HPA por Ingress.
#   Debe quedar por debajo de rateLimit.rps: un solo origen no supera rateLimit.rps, así que
#   desde una máquina el HPA llega a ceil(rateLimit.rps / ingressRpsPerPod) réplicas.

basic:
  maxReplicas: 5
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 250m, memory: 256Mi}
  rateLimit:            # límite de solicitudes HTTP por IP de origen en el Ingress
    rps: 10
    connections: 20
    burstMultiplier: 1
  scaling:              # objetivo del HPA por Ingress (lo fija el proveedor, no el cliente)
    ingressRpsPerPod: 5
standard:
  maxReplicas: 8
  resources:
    requests: {cpu: 150m, memory: 192Mi}
    limits: {cpu: 300m, memory: 384Mi}
  rateLimit:
    rps: 50
    connections: 100
    burstMultiplier: 1
  scaling:
    ingressRpsPerPod: 20