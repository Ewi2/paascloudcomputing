{{- $plan := include "paas.plan" . | fromYaml -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.appName }}
  labels:
    {{- include "paas.labels" . | nindent 4 }}
  annotations:
    # Límite de solicitudes HTTP por IP de origen, definido por el plan (no por el cliente)
    nginx.ingress.kubernetes.io/limit-rps: {{ int $plan.rateLimit.rps | quote }}
    nginx.ingress.kubernetes.io/limit-connections: {{ int $plan.rateLimit.connections | quote }}
    nginx.ingress.kubernetes.io/limit-burst-multiplier: {{ int $plan.rateLimit.burstMultiplier | quote }}
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  rules:
  - host: {{ .Values.domain | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.appName }}
            port:
              name: http
