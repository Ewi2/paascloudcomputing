{{- if .Values.autoscaling.enabled }}
{{- $plan := include "paas.plan" . | fromYaml -}}
{{- $rpsPerPod := required (printf "plans.yaml: falta scaling.ingressRpsPerPod en el plan '%s'" .Values.plan) (dig "scaling" "ingressRpsPerPod" "" $plan) -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.appName }}
  labels:
    {{- include "paas.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.appName }}
  minReplicas: {{ int .Values.replicaCount }}
  maxReplicas: {{ int .Values.autoscaling.maxReplicas }}
  metrics:
  # 1. CPU (Metrics Server). El cliente elige el objetivo (10-95 %).
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ int .Values.autoscaling.targetCPU }}
  # 2. Peticiones/s del Ingress (Prometheus Adapter). El objetivo lo fija el plan.
  - type: Object
    object:
      describedObject:
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        name: {{ .Values.appName }}
      metric:
        name: ingress_requests_per_second
      target:
        type: AverageValue
        averageValue: {{ int $rpsPerPod | quote }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
{{- end }}